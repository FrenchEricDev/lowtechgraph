<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <!-- Higher contrast before the first paint (Settings, 2026-11-06); the app keeps it in step. -->
    <script>try{if(localStorage.getItem("contrast")==="more")document.documentElement.setAttribute("data-contrast","more")}catch(e){}</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The phone's bar takes the header's colour in each theme (= --header-bg). -->
    <meta name="theme-color" content="#4F6247" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#221F19" media="(prefers-color-scheme: dark)" />
    <title>webapp</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
